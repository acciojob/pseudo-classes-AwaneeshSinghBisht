<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Pseudo Classes</title>

    <style>
        /* Set page background using :root */
        :root {
            background-color: rgb(135, 206, 235);
        }

        /* First paragraph */
        article p:first-child {
            color: white;
            background-color: black;
        }

        /* Second paragraph */
        article p:nth-child(2) {
            color: black;
        }

        /* Third paragraph */
        article p:last-child {
            color: red;
        }

        /* All list items */
        ul li {
            background-color: gray;
            width: 50%;
            padding: 10px;
        }

        /* Odd list items */
        ul li:nth-child(odd) {
            background-color: white;
        }

        /* First and last list items */
        ul li:first-child,
        ul li:last-child {
            font-size: 22px;
        }

        /* Third-to-last item */
        ul li:nth-last-child(3) {
            background-color: pink;
        }
    </style>
</head>
<body>

    <article>
        <p>This is the first paragraph.</p>
        <p>This is the second paragraph.</p>
        <p>This is the third paragraph.</p>
    </article>

    <ul>
        <li>List Item 1</li>
        <li>List Item 2</li>
        <li>List Item 3</li>
        <li>List Item 4</li>
        <li>List Item 5</li>
    </ul>

</body>
</html>
